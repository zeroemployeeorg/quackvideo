[project]
name = "quackvideo"
version = "0.2.0"
description = "Transcript-first content engine for podcasts, talking-head, tutorial, and social video packages."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Rod Rivera", email = "rod@aiproduct.engineer" }]
keywords = ["ffmpeg", "content-creation", "podcast", "video", "transcription", "cli"]
dependencies = [
    "httpx>=0.27",
    "pydantic-settings>=2.2",
    "pydantic>=2.6",
    "pyyaml>=6.0.1",
    "rich>=13.6",
    "typer>=0.12",
    "zeocore>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8.0",
    "pytest-cov>=4.1.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "types-pyyaml",
]
llms = ["zeocore[llms]>=0.1.0"]
all = ["zeocore[llms]>=0.1.0"]

[project.scripts]
quackvideo = "quackvideo.cli:app"

[project.urls]
Homepage = "https://github.com/rodmtech/quackvideo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "requires_ffmpeg: needs ffmpeg and ffprobe on PATH",
]

[tool.coverage.run]
source = ["quackvideo"]
branch = true

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N"]
ignore = ["N818", "E501", "B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["quackvideo"]
mypy_path = "src"
exclude = ["examples", "quack-media"]

[[tool.mypy.overrides]]
module = ["zeo_core.*"]
ignore_missing_imports = true
